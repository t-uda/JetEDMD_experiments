[tool.poetry]
name = "jetedmd-env-pysindy"
version = "0.1.0"
description = "Poetry environment for JetEDMD experiments (PySINDy stack)."
authors = ["Project JetEDMD maintainers"]
license = "MIT"
packages = []
package-mode = false

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
jetedmd-experiments = { path = "../..", develop = true }
numpy = ">=1.22"
matplotlib = ">=3.5"
pyyaml = ">=6.0"
pysindy = "^1.7"
setuptools = "^80.9.0"
cvxpy = "^1.7.3"

[tool.poetry.group.dev.dependencies]
pytest = "^8.4.2"
black = "^25.9.0"

[build-system]
requires = ["poetry-core>=1.5.0"]
build-backend = "poetry.core.masonry.api"
