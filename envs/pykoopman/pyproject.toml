[tool.poetry]
name = "jetedmd-env-pykoopman"
version = "0.1.0"
description = "Poetry environment for JetEDMD experiments (PyKoopman stack)."
authors = ["Project JetEDMD maintainers"]
license = "MIT"
packages = []
package-mode = false

[tool.poetry.dependencies]
python = ">=3.10,<3.12"
jetedmd-experiments = { path = "../..", develop = true }
numpy = ">=1.20,<1.27"
scipy = ">1.6.0,<=1.11.2"
scikit-learn = "1.1.3"
matplotlib = "3.5.0"
pykoopman = "1.1.0"
pydmd = "0.4.1"
derivative = "0.6.0"
optht = "0.2.0"
prettytable = "3.9.0"
torch = "2.1.0"
torchvision = "0.16.0"
torchaudio = "2.1.0"
lightning = "2.0.9"
setuptools = "^80.9.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.4"

[[tool.poetry.source]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
priority = "supplemental"

[build-system]
requires = ["poetry-core>=1.5.0"]
build-backend = "poetry.core.masonry.api"
